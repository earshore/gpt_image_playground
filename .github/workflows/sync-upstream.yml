name: Sync upstream

on:
  schedule:
    # 每天一次，北京时间 03:00（UTC 19:00），避开使用高峰
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CookSleep/gpt_image_playground.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merging upstream/main ($(git rev-parse --short upstream/main)) into main"

          git merge --no-commit --no-ff upstream/main || true

          # GITHUB_TOKEN has no permission to push workflow file changes
          # (GitHub rejects it as "refusing to allow a GitHub App to create
          # or update workflow ... without `workflows` permission"), so keep
          # the fork's own CI definitions and ignore upstream's edits here.
          git checkout HEAD -- .github/workflows 2>/dev/null || true

          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Unresolved merge conflicts outside .github/workflows; aborting."
            git ls-files -u
            git merge --abort || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Only workflow files changed upstream; nothing to sync."
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== staged changes ==="
          git diff --cached --stat

      - name: Set up Node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Gate: build must pass here before anything reaches main.
      # A broken upstream commit therefore never reaches production.
      - name: Verify build before publishing
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          echo "Build verified - safe to publish"

      - name: Push to main
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git commit -m "chore: sync upstream $(git -C . rev-parse --short upstream/main)"
          git push origin HEAD:main
          echo "Pushed to main - Vercel production deploy will start"
