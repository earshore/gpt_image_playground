name: Verify sync logic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce production merge against mock upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== fetch mock upstream ==="
          git fetch --no-tags origin mock-upstream

          echo "=== merge (same flags as production sync) ==="
          git merge --no-commit --no-ff origin/mock-upstream || true

          echo "=== drop upstream workflow edits (production logic) ==="
          git checkout HEAD -- .github/workflows 2>/dev/null || true

          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::unresolved conflicts remain"
            git ls-files -u
            git merge --abort || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "::error::no content changes after excluding workflows"
            git merge --abort || true
            exit 1
          fi

          echo "=== staged changes ==="
          git diff --cached --stat

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::workflow files still staged - push would be rejected"
            exit 1
          fi
          echo "OK: no workflow files staged"

          git commit -m "test: verify sync push works without workflow changes"

          echo "=== pushing to isolated branch ==="
          git push origin HEAD:test/sync-verify
          echo "OK: push succeeded - sync logic is valid"
